[package]
name = "craft-voice"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Push-to-talk questions for the ArtCraft apps: microphone capture, local Whisper transcription (candle), and the spoken text with the user's pointing spliced in as markers"
repository = "https://github.com/anton-belkin/craft-voice"
readme = "README.md"
keywords = ["whisper", "speech", "push-to-talk", "candle"]
categories = ["multimedia::audio"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

# The splice (text + pointing → markers) builds everywhere, wasm included; recording and
# transcription are native only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
cpal = "0.18"
ureq = "3"
sha2 = { version = "0.11", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
candle-transformers = { version = "0.11", features = ["metal"] }

[profile.test]
opt-level = 3

[[example]]
name = "transcribe"

[[example]]
name = "bench"
